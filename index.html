<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMB Cases Deficit Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .neu-brutal {
            background: white;
            border: 3px solid black;
            box-shadow: 5px 5px 0px black;
            transition: all 0.2s ease;
        }
        .neu-brutal:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px black;
        }
        .tab-active {
            background: #000;
            color: white;
        }
    </style>
</head>
<body class="bg-[#f0f0f0] p-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-6 neu-brutal p-4 text-center">CMB Cases Deficit Calculator</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="neu-brutal p-6 bg-gradient-to-br from-blue-50 to-blue-100">
                <h2 class="text-2xl font-bold mb-4 flex items-center"><i class="bi bi-graph-up mr-2"></i>Productivity Details</h2>
                <div class="grid grid-cols-1 gap-4">
                    <div class="space-y-4">
                        <div>
                            <label class="block mb-1 font-semibold">Production Hours Per Day</label>
                            <input type="number" id="prodHours" value="7.5" class="w-full p-2 border-2 border-black rounded" readonly>
                        </div>
                        <div>
                            <label class="block mb-1 font-semibold">Target RPH</label>
                            <input type="number" id="targetRPH" value="0.48" class="w-full p-2 border-2 border-black rounded" readonly>
                        </div>
                        <div>
                            <label class="block mb-1 font-semibold">Target RPD</label>
                            <input type="number" id="targetRPD" value="3.60" class="w-full p-2 border-2 border-black rounded" readonly>
                        </div>
                        <div>
                            <label class="block mb-1 font-semibold">Weekly Target</label>
                            <input type="number" id="weeklyTarget" value="18" class="w-full p-2 border-2 border-black rounded" readonly>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block mb-1 font-semibold">Cases Completed</label>
                            <input type="number" id="casesCompleted" class="w-full p-2 border-2 border-black rounded">
                        </div>
                        <div>
                            <label class="block mb-1 font-semibold">Working Days</label>
                            <input type="number" id="workingDays" class="w-full p-2 border-2 border-black rounded">
                        </div>
                    </div>
                </div>
            </div>

            <div class="neu-brutal p-6 bg-gradient-to-br from-red-50 to-red-100">
                <h2 class="text-2xl font-bold mb-4 flex items-center"><i class="bi bi-dash-circle mr-2"></i>Daily Deficit</h2>
                <div id="deficitResult" class="text-lg font-semibold whitespace-pre-line"></div>
            </div>

            <div class="neu-brutal p-6 bg-gradient-to-br from-green-50 to-green-100">
                <h2 class="text-2xl font-bold mb-4 flex items-center"><i class="bi bi-speedometer2 mr-2"></i>Efficiency</h2>
                <div id="efficiencyResult" class="text-lg font-semibold"></div>
            </div>
        </div>

        <button onclick="calculate()" class="neu-brutal p-4 w-full mt-6 text-xl font-bold">Calculate</button>
    </div>

    <script>
        function calculate() {
            const casesCompleted = Number(document.getElementById('casesCompleted').value);
            const workingDays = Number(document.getElementById('workingDays').value);
            const targetRPD = 3.60;

            // Calculate deficit
            const expectedCases = targetRPD * workingDays;
            const deficit = expectedCases - casesCompleted;
            document.getElementById('deficitResult').textContent =
                `Expected Cases: ${expectedCases.toFixed(2)}\nCompleted Cases: ${casesCompleted}\nDeficit: ${deficit.toFixed(2)}`;

            // Calculate efficiency
            const efficiency = (casesCompleted / expectedCases) * 100;
            let efficiencyMessage = '';
            if (efficiency >= 100) {
                efficiencyMessage = `Excellent! Efficiency: ${efficiency.toFixed(2)}%`;
            } else {
                efficiencyMessage = `Current Efficiency: ${efficiency.toFixed(2)}%`;
            }
            document.getElementById('efficiencyResult').textContent = efficiencyMessage;
        }
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
